<!doctype html>
<html lang="en" class="theme-light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>allw approvals</title>
    <!--
      Theme selection (issue #162) lives in `theme.js`, an external file rather than an inline
      script, so the Content-Security-Policy in `_headers` can forbid inline script outright
      (issue #249). It is a classic blocking script so it runs before the stylesheets load.
    -->
    <script src="./theme.js"></script>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Notices that must outlive screen changes in #app, e.g. an ignored ?relay= link (#249). -->
    <div id="notices"></div>
    <div id="app"></div>
    <!--
      `scripts/build-site.mjs` copies this file into `dist-site/`, bundles `src/app.ts` (the
      production boot sequence: relay-URL config → pairing gate → WASM-backed runtime → live
      inbox) to `dist-site/app.js`, and copies the vendored WASM to `dist-site/vendor/allw-wasm/`
      — all as flat siblings, so `./app.js` below resolves both here and once deployed to any
      static host. See `docs/web-approver-deploy.md`.
    -->
    <script type="module" src="./app.js"></script>
  </body>
</html>
