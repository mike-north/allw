[package]
name = "allw-uniffi"
version = "0.0.0"
description = "UniFFI bindings exposing allw-core to Swift and Kotlin native apps."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[lints]
workspace = true

[dependencies]
allw-core = { path = "../allw-core" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = { version = "0.31.1", features = ["cli"] }
# Scrub decoded seed/secret material from memory on drop. Seeds cross the FFI as base64 strings,
# get decoded into heap `Vec<u8>` / stack `[u8; 32]`, and must not linger after use — wrap every
# decoded seed in `Zeroizing<>` so Drop zeroes the bytes (issue #90). 1.8.x is already in the
# lockfile via x25519-dalek's `zeroize` feature, so this adds no new transitive tree.
zeroize = "1"

[dev-dependencies]
# Deterministic CSPRNG for building real JWE fixtures in the prepare() smoke tests. `encrypt_context`
# takes an injected `CryptoRng + RngCore` (the core never links an OS RNG), so the test supplies a
# fixed-seed ChaCha20 stream — matching the core's own jwe.rs test convention. Already in the
# lockfile via allw-core's dev-deps, so this adds no new transitive tree.
rand_chacha = "0.3"
