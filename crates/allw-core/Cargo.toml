[package]
name = "allw-core"
version = "0.0.0"
description = "Core types and crypto for the allw approval primitive: contract, verdict signing/verification, audit chaining."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["rlib", "cdylib"] # rlib for Rust consumers; cdylib for FFI/WASM surfaces later

[lints]
workspace = true

[dependencies]
# Intentionally dependency-free for the initial skeleton.
# Planned as modules are implemented:
#   serde + serde_json     — wire types
#   josekit / rust JOSE     — JWE (context) + JWS (verdicts/rules)
#   ed25519-dalek           — verdict/rule signatures
#   x25519-dalek            — ECDH for E2EE context
#   sha2                    — audit hash chain + request_hash
#   uniffi                  — Swift/Kotlin bindings
#   wasm-bindgen            — WASM for node/browser surfaces
