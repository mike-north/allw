# Weekly early warning for the Rust toolchain pin in rust-toolchain.toml. It is not a required
# check, and it never runs on ordinary PRs.
#
# - Builds, lints and tests the workspace on the latest stable Rust. New clippy lints, rustfmt
#   changes or breakage show up here before the pin is bumped, not in the bump PR.
# - Fails when the pin is two or more stable releases behind (about twelve weeks; releases come
#   every six). That failure is the bump reminder: GitHub notifies the person who last edited
#   this schedule when a scheduled run fails.
#
# The bump procedure lives in rust-toolchain.toml.
name: Rust canary (latest stable)

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch: {}
  pull_request:
    paths:
      - rust-toolchain.toml
      - .github/workflows/rust-canary.yml
      - .github/actions/rust-toolchain/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    name: Latest stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: stable
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: canary-stable
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --all-targets --locked -- -D warnings
      - run: cargo +stable test --locked
      - run: cargo +stable check -p allw-wasm --target wasm32-unknown-unknown --locked
      # Last, so the build/lint/test results above are reported even when the pin is stale.
      - name: Check the pin's age
        run: |
          set -euo pipefail
          pinned=$(sed -n 's/^channel = "\([0-9.]*\)".*/\1/p' rust-toolchain.toml)
          latest=$(rustc +stable --version | awk '{print $2}')
          if [ -z "$pinned" ]; then
            echo "::error file=rust-toolchain.toml::no exact channel version found"
            exit 1
          fi
          behind=$(( $(echo "$latest" | cut -d. -f2) - $(echo "$pinned" | cut -d. -f2) ))
          echo "pinned $pinned, latest stable $latest ($behind minor releases behind)"
          if [ "$behind" -ge 2 ]; then
            echo "::error file=rust-toolchain.toml::the pin ($pinned) is $behind stable releases behind $latest; bump it (procedure in rust-toolchain.toml)"
            exit 1
          elif [ "$behind" -ge 1 ]; then
            echo "::warning file=rust-toolchain.toml::stable $latest is out; the pin is $pinned"
          fi
