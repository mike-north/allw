name: CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo check --locked
      - run: cargo test --locked

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first (topological order): packages that consume another package's *types* — e.g.
      # @allw/hook importing @allw/sdk — need that dependency's built `dist/*.d.ts` to exist before
      # they typecheck/lint. `pnpm -r build` respects the workspace dependency graph.
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm exec prettier --check "**/*.{ts,js,mjs,json,md}"

  wasm:
    name: WASM parity (Rust ↔ TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build the wasm-bindgen shell (the .wasm + glue are generated, not committed).
      - run: pnpm run build:wasm
      # The node parity test feeds the shared cross-platform vector through the compiled wasm,
      # asserting request-hash/v2 parity and verdict accept/reject (fail-closed).
      - run: pnpm --filter @allw/sdk test
      # The stand-in approver's integration tests run the same compiled wasm (decrypt → recompute
      # request_hash → sign → verify_verdict round-trip). It imports from dist/, so build first.
      - run: pnpm --filter @allw/approver build
      - run: pnpm --filter @allw/approver test
      # The Claude Code hook (the v1 beachhead) runs the same compiled wasm: it builds ActionRecords
      # via the core and runs the full SDK round-trip against a relay double. It imports from dist/
      # (and depends on @allw/sdk's dist), so build the SDK then the hook first.
      - run: pnpm --filter @allw/sdk build
      - run: pnpm --filter @allw/hook build
      - run: pnpm --filter @allw/hook test
      # The v0 walking-skeleton e2e composes the SAME compiled wasm through the real sdk + approver +
      # hook in one round-trip (approve→allow, deny→deny, timeout→expired, integrator re-verify, and
      # the zero-knowledge storage assertion). It imports from dist/ (and depends on sdk/approver/hook
      # dist), so build it after them. The genuinely-live workerd stack is the local `demo:e2e`
      # script, not CI (see examples/walking-skeleton/README.md → Test layers).
      - run: pnpm --filter @allw/example-walking-skeleton build
      - run: pnpm --filter @allw/example-walking-skeleton test
      # The web approver's production static-site bundle (issue #180) needs the vendored wasm to
      # copy into dist-site/ (scripts/build-site.mjs), so it is re-built here rather than in the
      # `typescript` job, which runs `pnpm -r build` before any wasm step; there the site bundle
      # step is a no-op skip (see scripts/build-site.mjs's module doc).
      - run: pnpm --filter @allw/web-approver build
      # Workspace-level TS test gate (#15). This intentionally runs after build:wasm + dist builds
      # above because several package tests load the generated WASM glue or compiled workspace deps.
      - run: pnpm -r test

  relay:
    name: Relay (workers-pool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @allw/relay test

  native-bindings:
    name: Native bindings (UniFFI)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Cache the network installs so a transient brew/Maven outage can't fail the job (#90).
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-kotlin-${{ runner.os }}
      - uses: actions/cache@v4
        id: jna-cache
        with:
          path: jna-cache/jna-5.17.0.jar
          key: jna-5.17.0
      - if: steps.jna-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p jna-cache
          curl --fail --silent --show-error --location \
            "https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.17.0/jna-5.17.0.jar" \
            --output jna-cache/jna-5.17.0.jar
      - run: brew install kotlin
      - run: cargo test --locked -p allw-uniffi
      - run: ./scripts/uniffi-smoke.sh
        env:
          JNA_JAR: ${{ github.workspace }}/jna-cache/jna-5.17.0.jar
      # iOS approver state-machine tests (swiftc-based script; SPM `swift test` is intentionally
      # avoided — the suite is an executable target so it runs on CommandLineTools-only hosts too).
      - run: bash apps/ios-approver/scripts/test-ios-approver.sh

  packaged-install:
    name: Packaged install (pack → npm install → smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rust + wasm-pack so build:wasm produces the artifact that must be BUNDLED into the @allw/sdk
      # tarball (the install path under test ships the wasm; it must not need a toolchain itself).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:wasm
      - run: pnpm -r build
      - run: pnpm run smoke:packaged-install
