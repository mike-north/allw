<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>allw — Hero Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="hero.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: "Hanken Grotesk", sans-serif; }
  .ab-skin { height: 100%; width: 100%; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="hero-variants.jsx"></script>
<script type="text/babel">
const { useState } = React;
const Skin = ({ theme, children }) => (
  <div className={"ab-skin theme-" + theme}>{children}</div>
);

function App() {
  return (
    <DesignCanvas title="allw · Approver Inbox" subtitle="Hero exploration — Request Detail (the screen that carries the whole product)">
      <DCSection id="dark" title="Request Detail — Dark (default)" subtitle="Same request (CRITICAL force-push to main) in three visual directions">
        <DCArtboard id="a-dark" label="A · Signed Receipt" width={384} height={720}>
          <Skin theme="dark"><HeroA /></Skin>
        </DCArtboard>
        <DCArtboard id="b-dark" label="B · Confirmation Slip" width={384} height={720}>
          <Skin theme="dark"><HeroB /></Skin>
        </DCArtboard>
        <DCArtboard id="c-dark" label="C · Instrument Panel" width={384} height={720}>
          <Skin theme="dark"><HeroC /></Skin>
        </DCArtboard>
      </DCSection>
      <DCSection id="light" title="Request Detail — Light" subtitle="The same three, in the warm-paper light theme">
        <DCArtboard id="a-light" label="A · Signed Receipt" width={384} height={720}>
          <Skin theme="light"><HeroA /></Skin>
        </DCArtboard>
        <DCArtboard id="b-light" label="B · Confirmation Slip" width={384} height={720}>
          <Skin theme="light"><HeroB /></Skin>
        </DCArtboard>
        <DCArtboard id="c-light" label="C · Instrument Panel" width={384} height={720}>
          <Skin theme="light"><HeroC /></Skin>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
