# The single source of truth for the Rust toolchain used locally AND in CI.
#
# Pinned to an exact stable release (not the floating `stable` channel) so a new Rust release —
# new clippy lints under `-D warnings`, rustfmt changes, new rustc warnings — can never turn CI red
# on a commit that was green yesterday. Toolchain upgrades are deliberate, reviewed changes.
#
# CI installs exactly this file's toolchain (`rustup toolchain install` in .github/workflows/ci.yml
# reads it), so there is no second version string to keep in sync.
#
# Bump procedure (roughly every six weeks, or when a dependency needs a newer rustc):
#   1. Set `channel` to the new release (see https://releases.rs or `rustup check`).
#   2. Run the CLAUDE.md verification gate locally (`cargo fmt --check`, `cargo clippy
#      --all-targets --locked -- -D warnings`, `cargo test --locked`, `pnpm run build:wasm`, ...).
#   3. Fix any new lints/format drift in the same PR; open it as a dedicated toolchain-bump PR.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
# `pnpm run build:wasm` (part of the verification gate) compiles crates/allw-wasm for this target.
targets = ["wasm32-unknown-unknown"]
